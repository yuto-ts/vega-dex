<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ポケモン ファンゲーム攻略</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#ffffff; --bg2:#f5f7fb; --ink:#1c2230; --muted:#5d6675; --line:#d7dde8; --line2:#e9edf4;
  --head:#1f3a70; --head-ink:#ffffff; --accent:#f2b73f; --accent-ink:#3a2a00;
  --tint:#e8eef9; --tint-ink:#1f3a70; --link:#1a56b0; --hover:#f0f4fb;
  --bar-lo:#e0665a; --bar-mid:#f0a33c; --bar-ok:#e3c62b; --bar-good:#63b96a; --bar-hi:#4a8fe0;
  --shadow:0 1px 2px rgba(20,30,60,.08);
  --f-head:"Zen Kaku Gothic New","Noto Sans JP","Hiragino Sans",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14171e; --bg2:#1b1f28; --ink:#e4e7ee; --muted:#9aa3b3; --line:#2c3340; --line2:#232935;
    --head:#182b52; --head-ink:#f2f4f8; --accent:#f2b73f; --accent-ink:#3a2a00;
    --tint:#20293b; --tint-ink:#c7d3ee; --link:#7fb0ff; --hover:#1f2530;
    --bar-lo:#d9645a; --bar-mid:#e39a3a; --bar-ok:#d4b92c; --bar-good:#5fb368; --bar-hi:#5a98e6;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14171e; --bg2:#1b1f28; --ink:#e4e7ee; --muted:#9aa3b3; --line:#2c3340; --line2:#232935;
  --head:#182b52; --head-ink:#f2f4f8; --accent:#f2b73f; --accent-ink:#3a2a00;
  --tint:#20293b; --tint-ink:#c7d3ee; --link:#7fb0ff; --hover:#1f2530;
  --bar-lo:#d9645a; --bar-mid:#e39a3a; --bar-ok:#d4b92c; --bar-good:#5fb368; --bar-hi:#5a98e6;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img.sprite{image-rendering:pixelated;image-rendering:crisp-edges}

/* header */
.top{background:var(--head);color:var(--head-ink);position:sticky;top:0;z-index:20;box-shadow:0 1px 0 rgba(0,0,0,.2)}
.top-in{max-width:1120px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--f-head);font-weight:900;font-size:22px;letter-spacing:.02em;color:var(--head-ink);display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand small{font-family:var(--f-body);font-weight:500;font-size:11px;opacity:.75;letter-spacing:.08em}
.brand:hover{text-decoration:none}
.brand .star{color:var(--accent)}
.game{font-family:var(--f-head);font-weight:700;font-size:13px;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:2px 10px;white-space:nowrap}
.game:hover{text-decoration:none;filter:brightness(1.05)}
.search{position:relative;flex:1 1 260px;max-width:460px}
/* ハブ・ゲーム別トップ */
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:12px 0 24px}
.hub .card{padding:18px}
.hub .card b{font-size:20px}
.hub .card.soon{opacity:.6}
.hub .badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink);margin-left:6px;vertical-align:middle}
.hub .badge.gray{background:var(--line);color:var(--muted)}
.menu2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:700px){.menu2{grid-template-columns:1fr}}
.menu2 ul{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.menu2 li{border-bottom:1px solid var(--line2)}
.menu2 li:last-child{border-bottom:0}
.menu2 li a{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;color:var(--ink);font-weight:500}
.menu2 li a:hover{background:var(--hover);text-decoration:none}
.menu2 li a span{font-size:12px;color:var(--muted);font-weight:400}
.menu2 li.sub a{padding-left:28px;font-weight:400}
/* wiki 由来の攻略ページ */
.wiki{max-width:860px;line-height:1.7}
.wiki h3{font-family:var(--f-head);font-size:16px;margin:26px 0 8px;padding-left:10px;border-left:4px solid var(--accent)}
.wiki h4{font-family:var(--f-head);font-size:14px;margin:18px 0 6px;padding-bottom:3px;border-bottom:1px solid var(--line)}
.wiki h5{font-size:13px;margin:12px 0 4px}
.wiki table{width:auto;max-width:100%;margin:6px 0 10px;border:1px solid var(--line);border-radius:6px;font-size:13px}
.wiki th{position:static}
.wiki td,.wiki th{border-right:1px solid var(--line2)}
.wiki td:last-child,.wiki th:last-child{border-right:0}
.wiki td[style*="background-color"]{color:#1c2230}
.wiki details{border:1px solid var(--line);border-radius:6px;padding:6px 12px;margin:8px 0;background:var(--bg2)}
.wiki summary{cursor:pointer;font-weight:700;color:var(--link)}
.wiki details[open] summary{margin-bottom:6px}
.wiki big{font-size:15px;font-weight:700}
.wiki ul,.wiki ol{padding-left:1.5em}
.wiki hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.wiki .tbl-wrap{margin:6px 0 10px}
.toc{font-size:13px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;margin:0 0 14px;max-width:860px}
.toc a{margin-right:12px;white-space:nowrap;line-height:1.9}
.toc .h4{font-size:12px;color:var(--muted)}
.enc-area{display:flex;align-items:baseline;gap:8px;font-family:var(--f-head);font-weight:700;font-size:14px;margin:14px 0 6px}
.enc-area .post{font-size:11px;font-weight:700;padding:0 7px;border-radius:999px;background:var(--head);color:var(--head-ink)}
.terrain{display:inline-block;font-size:11px;padding:0 6px;border-radius:3px;background:var(--tint);color:var(--tint-ink);white-space:nowrap}
/* 場所・トレーナー画像 */
.locfig{margin:0 0 14px;display:inline-block;max-width:100%}
.locfig img{display:block;max-width:100%;max-height:520px;border:1px solid var(--line);border-radius:6px;background:var(--bg2)}
.locfig img.px{image-rendering:pixelated;width:480px;max-width:100%}
.locfig figcaption{font-size:11px;color:var(--muted);margin-top:4px}
.leader{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);margin:0 0 14px}
.leader img.tr{width:128px;height:128px;image-rendering:pixelated;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.leader .who{font-family:var(--f-head);font-size:20px;font-weight:700}
.leader .role{font-size:12px;color:var(--muted)}
.leader .thumb{margin-left:auto;text-align:center;font-size:12px}
.leader .thumb img{display:block;width:220px;max-width:100%;border:1px solid var(--line);border-radius:6px}
.trs{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.trs .tr1{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;width:96px}
.trs .tr1 img{width:96px;height:96px;image-rendering:pixelated;background:var(--bg2);border:1px solid var(--line);border-radius:8px;object-fit:contain}
.wiki td img.s32{width:32px;height:32px;vertical-align:middle;margin:-4px 4px -4px 0}
.src{font-size:11px;color:var(--muted)}
.optlab{color:var(--muted);font-weight:700;margin-right:2px}
/* 攻略チャート */
.chart-toc .toc-part{padding:4px 0;border-bottom:1px solid var(--line2)}
.chart-toc .toc-part:last-child{border-bottom:0}
.chart-toc .toc-part b{display:inline-block;min-width:110px;color:var(--muted);font-size:12px}
.chart-intro{max-width:860px;margin:0 0 12px;border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:var(--bg2)}
.chart-intro summary{cursor:pointer;font-weight:700;color:var(--link)}
.chapter{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:center;margin:22px 0 10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg2)}
.chapter h3{font-family:var(--f-head);font-size:18px;margin:0 0 6px}
.chapter .chapter-locs{font-size:13px;line-height:1.9}
.chapter .tmap{border-radius:6px}
@media (max-width:760px){.chapter{grid-template-columns:1fr}}
.step{display:grid;grid-template-columns:200px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line2)}
@media (max-width:640px){.step{grid-template-columns:1fr}}
.step-img img{display:block;width:200px;max-width:100%;max-height:200px;object-fit:cover;object-position:top;border:1px solid var(--line);border-radius:6px;background:var(--bg2)}
.step-img .tmap{width:200px}
.step-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.step-head h4{font-family:var(--f-head);font-size:16px;margin:0}
.step-no{display:inline-block;min-width:24px;height:24px;line-height:24px;text-align:center;border-radius:6px;background:var(--head);color:var(--head-ink);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.step-trs{display:inline-flex;gap:6px;margin-left:auto}
.step-trs span{display:inline-flex;flex-direction:column;align-items:center;font-size:10px;color:var(--muted)}
.step-trs img.tr{width:48px;height:48px;image-rendering:pixelated;background:var(--bg2);border:1px solid var(--line);border-radius:6px}
.step-wiki{max-width:none}
.step.flash{background:var(--tint);transition:background .4s}
.step{scroll-margin-top:70px}
.step-wiki>ul{margin:0;padding-left:1.3em}
.step-wiki>ul>li{margin:2px 0}
.step-wiki details{margin:6px 0}
.step-wiki h3,.step-wiki h4{font-size:14px;margin:10px 0 4px;border:0;padding:0}
.floors{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.floors .floor{margin:0;max-width:100%}
.floors .floor img{display:block;max-height:260px;max-width:100%;border:1px solid var(--line);border-radius:6px;background:var(--bg2);cursor:zoom-in}
.floors .floor figcaption{font-size:12px;color:var(--muted);margin-top:3px;text-align:center}
.zoom{position:fixed;inset:0;z-index:50;background:rgba(10,14,24,.88);display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;overflow:auto}
.zoom img{max-width:100%;max-height:100%;object-fit:contain;image-rendering:pixelated;border-radius:6px;background:#fff}
.zoom.native img{max-width:none;max-height:none;width:auto;height:auto}
.zoom .cap{position:fixed;left:0;right:0;bottom:12px;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 2px #000}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid transparent;border-radius:6px;background:rgba(255,255,255,.14);color:var(--head-ink);font:inherit;font-size:14px}
.search input::placeholder{color:rgba(255,255,255,.65)}
.search input:focus{background:var(--bg);color:var(--ink);outline:2px solid var(--accent);outline-offset:0}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;opacity:.8;pointer-events:none}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);overflow:hidden;display:none;max-height:70vh;overflow-y:auto}
.sug.on{display:block}
.sug a{display:flex;align-items:center;gap:10px;padding:6px 10px;color:var(--ink);border-bottom:1px solid var(--line2)}
.sug a:last-child{border-bottom:0}
.sug a:hover,.sug a.act{background:var(--hover);text-decoration:none}
.sug .k{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}
.sug img{width:32px;height:32px}
.nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.nav a{color:var(--head-ink);padding:6px 10px;border-radius:6px;font-weight:500;font-size:13px;opacity:.9}
.nav a:hover{background:rgba(255,255,255,.12);text-decoration:none;opacity:1}
.nav a.cur{background:rgba(255,255,255,.18);opacity:1}

main{max-width:1120px;margin:0 auto;padding:16px 16px 48px}
h1{font-family:var(--f-head);font-weight:700;font-size:22px;margin:4px 0 12px;text-wrap:balance;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1 .sub{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted)}
h2{font-family:var(--f-head);font-weight:700;font-size:16px;margin:26px 0 8px;padding-left:10px;border-left:4px solid var(--accent);line-height:1.3}
h2 .cnt{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted);margin-left:8px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:6px}

/* type badges */
.ty{display:inline-block;padding:1px 8px;border-radius:4px;font-size:12px;font-weight:700;color:#fff;line-height:1.6;text-shadow:0 1px 1px rgba(0,0,0,.25);white-space:nowrap;min-width:52px;text-align:center}
a.ty:hover{text-decoration:none;filter:brightness(1.08)}
.ty.small{font-size:11px;padding:0 6px;min-width:44px}
.tys{display:inline-flex;gap:3px;flex-wrap:wrap;vertical-align:middle}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
th{background:var(--tint);color:var(--tint-ink);font-weight:700;font-size:12px;white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hover)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{filter:brightness(.96)}
th.sort.on{color:var(--accent-ink);background:var(--accent)}
th.sort .arr{font-size:10px;opacity:.7;margin-left:2px}
.tbl-wrap.compact td,.tbl-wrap.compact th{padding:3px 6px}
td img.sprite{width:40px;height:40px;display:block}
.name{font-weight:700}
.kv{width:100%}
.kv th{width:34%;text-align:left;background:var(--tint);position:static}
.kv td{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.chip{display:inline-block;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;margin:2px 2px 2px 0;color:var(--ink)}
a.chip:hover{border-color:var(--link);text-decoration:none}
.chip.on{background:var(--head);color:var(--head-ink);border-color:var(--head)}

/* filter bar */
.filters{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px;display:grid;gap:8px}
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.frow .lab{font-size:12px;font-weight:700;color:var(--muted);min-width:56px}
.frow select,.frow input[type=text]{font:inherit;font-size:13px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.tybtn{cursor:pointer;opacity:.45;border:0;font:inherit}
.tybtn.on{opacity:1;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.tybtn:hover{opacity:.85}
.btn{font:inherit;font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer}
.btn:hover{background:var(--hover)}
.count{font-size:12px;color:var(--muted);margin-left:auto}

/* detail */
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);margin-bottom:14px}
.hero .pic{width:128px;height:128px;background:var(--bg);border:1px solid var(--line);border-radius:8px;display:grid;place-items:center}
.hero .pic img{width:128px;height:128px}
.hero .no{font-size:13px;color:var(--muted);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.hero h1{margin:0 0 6px;font-size:28px}
.pn{display:flex;flex-direction:column;gap:6px;font-size:12px}
.pn a{display:flex;align-items:center;gap:6px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 8px;white-space:nowrap}
.pn a:hover{background:var(--hover);text-decoration:none}
.pn img{width:24px;height:24px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.two{grid-template-columns:1fr}.hero{grid-template-columns:auto 1fr}.pn{grid-column:1/-1;flex-direction:row}}
.stats{width:100%}
.stats th{width:64px;position:static;background:var(--tint)}
.stats td.v{width:44px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.stats td.r{width:56px;font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.bar{height:12px;background:var(--line2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.stats tr.total td{font-weight:700;border-top:2px solid var(--line)}
.evo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0}
.evo .node{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:96px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);color:var(--ink);text-align:center}
.evo .node:hover{background:var(--hover);text-decoration:none}
.evo .node.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.evo .node img{width:56px;height:56px}
.evo .node b{font-size:13px}
.evo .arrow{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);text-align:center;max-width:120px}
.evo .arrow::before{content:"▶";font-size:16px;color:var(--muted)}
.evo .branch{display:flex;flex-direction:column;gap:8px}
.evo .pair{display:flex;align-items:center;gap:8px}
.mx{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.mx .cell{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg2)}
.mx .cell b{display:block;font-size:12px;margin-bottom:4px}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin-bottom:8px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:13px;font-weight:700;padding:6px 14px;border:0;background:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}
.tabs .n{font-weight:400;font-size:11px;margin-left:3px}
details.chain{font-size:12px}
details.chain summary{cursor:pointer;color:var(--link);list-style:none}
details.chain summary::before{content:"▸ ";font-size:10px}
details.chain[open] summary::before{content:"▾ "}
details.chain div{padding:2px 0 0 12px;color:var(--muted)}
.eff{font-size:12px;color:var(--muted);max-width:360px}
.chg{font-size:11px;color:var(--accent-ink);background:var(--accent);border-radius:3px;padding:0 5px;margin-left:4px;white-space:nowrap}
ul.plain{margin:0;padding-left:1.2em}
ul.plain li{margin:2px 0}
.learners{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 12px}
.learners a{display:flex;align-items:center;gap:6px;padding:2px 4px;border-radius:6px;color:var(--ink)}
.learners a:hover{background:var(--hover);text-decoration:none}
.learners img{width:32px;height:32px}
.learners .lvl{font-size:11px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.matrix td,.matrix th{text-align:center;padding:2px;font-size:12px}
.matrix th.rot{writing-mode:vertical-rl;text-orientation:upright;padding:6px 2px;letter-spacing:.05em}
.matrix td.x2,.matrix-key.x2{background:#6fb46f;color:#fff;font-weight:700}
.matrix td.x05,.matrix-key.x05{background:#e2a65a;color:#fff}
.matrix td.x0,.matrix-key.x0{background:#333a46;color:#fff}

<script>

// 技 → 覚えるポケモン の逆引き
const LEARN = {};

P.forEach(p => p.a.forEach(a => (ABIL[a] = ABIL[a] || []).push(p)));

P.forEach(p => p.egg.forEach(g => (EGGG[g] = EGGG[g] || []).push(p)));

// ---------- トーホク地方マップ（24x18 タイル）----------

const OFFS = {'D・Hだんアジト':[-.65,.55],こころのやかた:[.75,.6],'D・Hビル':[.65,-.55],ダークタワー:[.8,-.2],サファリゾーン:[.75,-.35],ポケモンじょう:[.65,.55],ときのようかん:[.35,.35]};
const ROUTES = {'501ばんどうろ':[[8,8],[9,8]],'502ばんどうろ':[[10,8],[10,7],[11,7]],'503ばんどうろ':[[12,8],[12,9]],'504ばんどうろ':[[11,10]],'505ばんどうろ':[[10,9],[10,10],[10,11]],'506ばんどうろ':[[8,11],[9,11]],'507ばんすいどう':[[10,13],[10,14],[11,14],[12,14]],'508ばんすいどう':[[14,14],[15,14]],'509ばんすいどう':[[16,14],[17,14]],'510ばんすいどう':[[18,13],[18,12]],'511ばんすいどう':[[17,12]],'512ばんすいどう':[[19,12]],'513ばんすいどう':[[18,11],[19,10],[19,9],[19,8],[19,7],[19,6],[19,5]],'514ばんどうろ':[[10,5],[10,6]],'515ばんどうろ':[[10,3]],'516ばんどうろ':[[8,4],[9,4]],'517ばんどうろ':[[7,5],[7,6],[7,7]],'518ばんどうろ':[[7,9],[7,10]],'519ばんどうろ':[[7,12],[6,12]],'520ばんどうろ':[[6,14],[7,14]],'521ばんどうろ':[[7,15],[8,15]],'522ばんどうろ':[[5,14],[4,14],[5,15]],'523ばんすいどう':[[2,14],[3,14]]};
const TILE = { ...TOWNS, ...DUNGEONS, ...ROUTES };
const SEA = new Set(['507','508','509','510','511','512','513','523']);
function parseHab(line) {
  const m = line.match(/^(.*?)(?:\((.*)\))?$/);
  let base = m[1].trim(), detail = m[2] || '', sub = '';
  const i = base.indexOf('-');
  if (i > 0) { sub = base.slice(i + 1); base = base.slice(0, i); }
  const bm = base.match(/^(.+?しま)(B\d.*)$/); if (bm) { base = bm[1]; sub = bm[2]; }
  base = base.replace(/\/$/, '');
  let names = [];
  const rm = base.match(/^([\d\/]+)ばん(どうろ|すいどう)$/);

const LOC = {};
P.forEach(p => p.hab.forEach(line => { const h = parseHab(line); h.names.forEach(n => (LOC[n] = LOC[n] || []).push({ p, sub: h.sub, detail: h.detail })); }));

const tileStyle = ([x, y]) => `left:${x / MAP_W * 100}%;top:${y / MAP_H * 100}%;width:${100 / MAP_W}%;height:${100 / MAP_H}%`;
// タイル集合を 1 つの領域として描く: 塗りは各タイル、線は外周（隣が同じ集合なら辺を引かない）

const RPATH = {'501ばんどうろ':[[7,8],[8,8],[9,8],[10,8]],'502ばんどうろ':[[10,8],[10,7],[11,7],[12,7]],'503ばんどうろ':[[12,7],[12,8],[12,9],[12,10]],'504ばんどうろ':[[12,10],[11,10],[10,10]],'505ばんどうろ':[[10,8],[10,9],[10,10],[10,11],[10,12]],'506ばんどうろ':[[7,11],[8,11],[9,11],[10,11]],'507ばんすいどう':[[10,12],[10,13],[10,14],[11,14],[12,14],[13,14]],'508ばんすいどう':[[13,14],[14,14],[15,14],[16,14]],'509ばんすいどう':[[16,14],[17,14],[18,14]],'510ばんすいどう':[[18,14],[18,13],[18,12]],'511ばんすいどう':[[18,12],[17,12],[16,12]],'512ばんすいどう':[[18,12],[19,12],[20,12]],'513ばんすいどう':[[18,12],[18,11],[18,10],[19,10],[19,5],[19,4]],'514ばんどうろ':[[10,7],[10,6],[10,5],[10,4]],'515ばんどうろ':[[10,4],[10,3],[10,2]],'516ばんどうろ':[[7,4],[8,4],[9,4],[10,4]],'517ばんどうろ':[[7,8],[7,7],[7,6],[7,5],[7,4]],'518ばんどうろ':[[7,8],[7,9],[7,10],[7,11]],'519ばんどうろ':[[7,11],[7,12],[6,12],[6,13]],'520ばんどうろ':[[6,13],[6,14],[7,14]],'521ばんどうろ':[[7,14],[7,15],[8,15],[8,16]],'522ばんどうろ':[[6,14],[5,14],[5,15],[4,15]],'523ばんすいどう':[[4,15],[4,14],[3,14],[2,14],[1,14]]};

  const mv = Object.keys(M).filter(has).sort((a, b) => (starts(b) - starts(a)) || a.localeCompare(b, 'ja')).slice(0, 5);
  const ab = Object.keys(ABIL).filter(has).slice(0, 4);
  const lc = Object.keys(TILE).filter(has).slice(0, 4);
  const items = [
    ...lc.map(n => `<a href="#/vega/loc/${encodeURIComponent(n)}"><span style="width:32px;text-align:center">📍</span><span>${esc(n)}</span><span class="k">場所 ${locCount(n)} 匹</span></a>`),
    ...pk.map(p => `<a href="#/vega/p/${p.n}">${img(p)}<span><b>${esc(p.name)}</b> ${tys(p.t, true)}</span><span class="k">No.${p.n}</span></a>`),
    ...mv.map(m => `<a href="#/vega/m/${encodeURIComponent(m)}"><span style="width:32px;text-align:center">${ty(M[m].t, true)}</span><span>${esc(m)}</span><span class="k">技 ${M[m].c} ${dash(M[m].p)}</span></a>`),
    ...ab.map(a => `<a href="#/vega/a/${encodeURIComponent(a)}"><span style="width:32px"></span><span>${esc(a)}</span><span class="k">特性 ${ABIL[a].length} 匹</span></a>`),
  ];
  sug.innerHTML = items.join('') || '<a class="muted">該当なし</a>';
  sug.classList.add('on'); sugIdx = -1;
}
qEl.addEventListener('input', suggest);
qEl.addEventListener('focus', suggest);
qEl.addEventListener('keydown', e => {
  const as = [...sug.querySelectorAll('a[href]')];
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sugIdx = (sugIdx + (e.key === 'ArrowDown' ? 1 : -1) + as.length) % as.length; as.forEach((a, i) => a.classList.toggle('act', i === sugIdx)); }
  else if (e.key === 'Enter') { const a = as[sugIdx >= 0 ? sugIdx : 0]; if (a) { location.hash = a.getAttribute('href'); sug.classList.remove('on'); qEl.blur(); } }
  else if (e.key === 'Escape') { sug.classList.remove('on'); qEl.blur(); }
});
document.addEventListener('click', e => { if (!e.target.closest('.search')) sug.classList.remove('on'); });
sug.addEventListener('click', () => { sug.classList.remove('on'); qEl.value = ''; });

// ---------- ビュー内のイベント ----------
function bindView() {
  const f = document.getElementById('filters');
  if (f) {
    f.querySelectorAll('.tybtn').forEach(b => b.addEventListener('click', () => { const cur = (listState().t || '').split(',').filter(Boolean); const t = b.dataset.t; const nx = cur.includes(t) ? cur.filter(x => x !== t) : [...cur, t].slice(-2); setList({ t: nx.join(',') }); }));
    f.querySelector('#f-a').addEventListener('change', e => setList({ a: e.target.value }));
    f.querySelector('#f-e').addEventListener('change', e => setList({ e: e.target.value }));
    f.querySelector('#f-evo').addEventListener('change', e => setList({ evo: e.target.value }));
    f.querySelector('#f-orig').addEventListener('change', e => setList({ orig: e.target.value }));
    let tm; f.querySelector('#f-q').addEventListener('input', e => { clearTimeout(tm); tm = setTimeout(() => { setList({ q: e.target.value }); }, 250); });
    f.querySelector('#f-clear').addEventListener('click', () => { location.hash = '#/vega/list'; });
    document.querySelectorAll('table.list th.sort').forEach(th => th.addEventListener('click', () => { const s = listState(); const k = th.dataset.k; const dir = s.sort === k ? (s.dir === 'asc' ? 'desc' : 'asc') : (k === 'n' || k === 'name' ? 'asc' : 'desc'); setList({ sort: k, dir }); }));
    const fq = f.querySelector('#f-q'); if (listState().q) { fq.focus(); fq.setSelectionRange(fq.value.length, fq.value.length); }
  }
  const mf = document.getElementById('mfilters');
  if (mf) {
    mf.querySelectorAll('.tybtn').forEach(b => b.addEventListener('click', () => setMoves({ t: parseHash().q.t === b.dataset.t ? '' : b.dataset.t })));
    mf.querySelector('#mf-c').addEventListener('change', e => setMoves({ c: e.target.value }));
    mf.querySelector('#mf-src').addEventListener('change', e => setMoves({ src: e.target.value }));
    mf.querySelector('#mf-orig').addEventListener('change', e => setMoves({ orig: e.target.value }));
    let tm; mf.querySelector('#mf-q').addEventListener('input', e => { clearTimeout(tm); tm = setTimeout(() => setMoves({ q: e.target.value }), 250); });
    mf.querySelector('#mf-clear').addEventListener('click', () => { location.hash = '#/vega/moves'; });
    document.querySelectorAll('#app th.sort').forEach(th => th.addEventListener('click', () => { const s = parseHash().q; const k = th.dataset.k; const dir = s.sort === k ? (s.dir === 'asc' ? 'desc' : 'asc') : (k === 'name' || k === 't' || k === 'c' ? 'asc' : 'desc'); setMoves({ sort: k, dir }); }));
    const fq = mf.querySelector('#mf-q'); if (parseHash().q.q) { fq.focus(); fq.setSelectionRange(fq.value.length, fq.value.length); }
  }
  document.querySelectorAll('[data-wiki]').forEach(decorateWiki);
  document.querySelectorAll('img[data-zoom]').forEach(im => im.addEventListener('click', () => {
    const z = document.createElement('div'); z.className = 'zoom';
    z.innerHTML = `<img src="${im.src}" alt=""><div class="cap">${esc(im.alt)}　（クリックで閉じる・もう一度クリックで原寸）</div>`;
    z.addEventListener('click', e => { if (e.target.tagName === 'IMG') { z.classList.toggle('native'); } else z.remove(); });
    document.addEventListener('keydown', function esc_(e) { if (e.key === 'Escape') { z.remove(); document.removeEventListener('keydown', esc_); } });
    document.body.appendChild(z);
  }));
  const st = document.getElementById('stage');
  if (st) st.addEventListener('change', e => { location.hash = '#/vega/map' + (e.target.value !== '' ? '?stage=' + e.target.value : ''); });
  document.querySelectorAll('.tmap').forEach(m => {
    const hov = (loc, on) => { m.querySelectorAll('.hot').forEach(h => h.classList.toggle('hov', on && h.dataset.loc === loc)); m.querySelectorAll('text.lbl.dg').forEach(t => t.classList.toggle('hov', on && t.dataset.loc === loc)); };
    m.addEventListener('mouseover', e => { const h = e.target.closest('.hot'); if (h) hov(h.dataset.loc, true); });
    m.addEventListener('mouseout', e => { const h = e.target.closest('.hot'); if (h) hov(h.dataset.loc, false); });
  });
  const tabs = document.getElementById('mtabs');
  if (tabs) tabs.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    tabs.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    document.querySelectorAll('[data-pane]').forEach(p => p.hidden = p.dataset.pane !== b.dataset.tab);
  }));
}
route();
})();
</script>
